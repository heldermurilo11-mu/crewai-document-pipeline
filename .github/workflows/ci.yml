name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pypdf google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dotenv pydantic httpx pytest

      - name: Syntax check all Python modules
        run: |
          python -m compileall -q runtime tools tests crew.py main.py

      - name: Run offline test suite
        run: |
          python -m pytest -v
